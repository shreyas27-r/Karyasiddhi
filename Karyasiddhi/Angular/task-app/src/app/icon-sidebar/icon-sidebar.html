<div class="icon-sidebar" [class.open]="isOpen">
  <ul>
    <li>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="bi bi-house"></i>
        @if(isOpen) {
          <span>Home</span>
        }
      </a>
    </li>

    <li>
      <a routerLink="/tasks" routerLinkActive="active">
        <i class="bi bi-list-check"></i>
        @if(isOpen) {
          <span>My Tasks</span>
        }
      </a>
    </li>

    <li class="bottom">
      <a routerLink="/helpp" routerLinkActive="active">
        <i class="bi bi-question-lg"></i>        
        @if(isOpen) {
          <span>Help</span>
        }
      </a>
    </li>
  </ul>
</div>
